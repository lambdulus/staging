name: Remote Dispatch Event Responder

# Controls when the workflow will run
on:
  repository_dispatch:
    types: [pr-deploy-staging]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x] # latest LTS
    
    steps:
    - name: Event Handle - Execute the deployment process
      uses: actions/checkout@v4
      with:
        # Repository name with owner. For example, actions/checkout
        repository: 'lambdulus/frontend'
        ref: ${{ github.event.client_payload.branch }}
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: |
        npm ci
        VITE_VERSION_INFO=$(date +"%m-%d-%y-%T") VITE_COMMIT=$(git rev-parse HEAD) npm run build --if-present
      env:
        # Stopgap: CRA4/webpack4 needs the legacy OpenSSL provider on Node 17+.
        # Remove once frontend's react-scripts is upgraded.
        NODE_OPTIONS: --openssl-legacy-provider
    - name: Checkout the current repo
      uses: actions/checkout@v4
      with:
        path: 'staging'
    - run: |
        mkdir -p ./staging/pr
        rm -rf ./staging/pr/${{ github.event.client_payload.branch }}
        mkdir -p ./staging/pr/${{ github.event.client_payload.branch }}
        mv ./build/* ./staging/pr/${{ github.event.client_payload.branch }}/
    - run: |
        cd ./staging/pr/${{ github.event.client_payload.branch }}
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add .
        git commit -m "deploy"
        # Preview and purge runs can race; rebase and retry the push
        # instead of failing on a stale checkout.
        for i in 1 2 3; do
          git fetch origin
          git rebase origin/main && git push && break
          git rebase --abort
          sleep 5
        done
